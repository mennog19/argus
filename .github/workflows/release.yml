name: Release

# Push a tag matching the app version to build the Windows installers and
# attach them, with SHA-256 checksums, to a draft GitHub Release:
#   git tag v0.1.0 && git push origin v0.1.0
# Review the draft on GitHub, then publish it.
#
# The tag must point at a commit on `main`: that's the only branch updates are
# built from. The installers are signed with the updater key (the
# TAURI_SIGNING_PRIVATE_KEY secret, plus TAURI_SIGNING_PRIVATE_KEY_PASSWORD if
# the key has one), and `latest.json` is the feed the in-app update check
# reads. It only reaches users once the draft is published, since GitHub's
# "latest release" link skips drafts.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Build installers and draft the release
    runs-on: windows-latest
    needs: [ci]
    # The signing key is a secret of this environment, which only `v*` tags
    # may use, so no other workflow or branch can read it.
    environment: release
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history, so the tagged commit can be checked against main.
          fetch-depth: 0

      - name: Check the tag is on main
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Tag $env:GITHUB_REF_NAME points at a commit that isn't on main. Releases are only built from main."
          }

      - name: Check the tag matches the app version
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME doesn't match version $version in src-tauri/tauri.conf.json."
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # The release config turns on the updater artifacts: a `.sig` next to
      # each installer, which fails the build if the signing key is missing.
      # `--ci` stops the signer waiting at a password prompt when the key has
      # no password: an empty secret doesn't reach Windows as a variable.
      - name: Build and sign the installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --ci --bundles nsis,msi --config src-tauri/tauri.release.conf.json

      - name: Collect installers and write checksums
        run: |
          New-Item -ItemType Directory release | Out-Null
          $bundle = "src-tauri/target/release/bundle"
          $installers = @(Get-ChildItem "$bundle/nsis/*.exe") + @(Get-ChildItem "$bundle/msi/*.msi")
          if ($installers.Count -ne 2) { throw "Expected one .exe and one .msi, found: $($installers.Name -join ', ')" }
          $sums = foreach ($installer in $installers) {
            Copy-Item $installer.FullName release/
            $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
            $line = "$hash  $($installer.Name)"
            Set-Content -Path "release/$($installer.Name).sha256" -Value $line -Encoding ascii
            $line
          }
          Set-Content -Path release/SHA256SUMS.txt -Value $sums -Encoding ascii

          # The update feed. Each installer's updater signature goes in it;
          # Argus refuses a download whose signature doesn't verify against
          # the public key it was built with.
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME"
          function Get-FeedEntry($installer) {
            $signature = "$($installer.FullName).sig"
            if (-not (Test-Path $signature)) { throw "Missing updater signature for $($installer.Name)." }
            [ordered]@{ signature = (Get-Content $signature -Raw).Trim(); url = "$base/$($installer.Name)" }
          }
          $nsis = $installers | Where-Object Extension -eq ".exe"
          $msi = $installers | Where-Object Extension -eq ".msi"
          $feed = [ordered]@{
            version = $env:VERSION
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              # Installs made with either installer update through the same kind.
              "windows-x86_64-nsis" = Get-FeedEntry $nsis
              "windows-x86_64-msi" = Get-FeedEntry $msi
              "windows-x86_64" = Get-FeedEntry $nsis
            }
          }
          # Written without a byte-order mark, which a JSON parser may refuse.
          [IO.File]::WriteAllText("$PWD/release/latest.json", ($feed | ConvertTo-Json -Depth 5))

          $notes = @(
            "Windows installers for Argus $env:VERSION. Either one installs the app."
            ""
            "Argus isn't code-signed, so Windows SmartScreen will warn before running the installer. Check the download against its SHA-256 checksum first:"
            ""
            '```'
            $sums
            '```'
          )
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem release/*).FullName `
            --draft --verify-tag --title "Argus $env:VERSION" --notes-file release-notes.md
