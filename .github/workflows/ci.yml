name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Lets the release workflow run the same checks before it builds installers.
  workflow_call:

jobs:
  frontend:
    name: Lint, test, coverage, audit (TypeScript)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm test:coverage

      # Fails on any known moderate-or-worse advisory in a JS dependency.
      - name: pnpm audit
        run: pnpm audit --audit-level moderate

  rust:
    name: Format, lint, test, audit (Rust)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-audit

      # Fails on any RustSec vulnerability in Cargo.lock. Unmaintained-crate
      # notices stay warnings.
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

  build:
    name: Build Tauri app
    # Not windows-latest: on the Windows Server 2025 image WebView2 never
    # opens the DevTools port msedgedriver waits for, so the end-to-end test
    # can't start a session ("DevToolsActivePort file doesn't exist").
    # https://github.com/actions/runner-images/issues/14738
    runs-on: windows-2022
    needs: [frontend, rust]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm tauri build --no-bundle

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      # Drives the app just built through WebDriver: unlock a vault, add an
      # entry, lock, and find it again. The unit tests fake everything Tauri
      # provides, so this is what shows the two halves still fit together.
      - name: End-to-end smoke test
        run: pnpm test:e2e
